name: build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-basiclaw-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-basiclaw-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint src --max-warnings 0

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Next.js production build
        run: rm -rf .next && npx next build --webpack
